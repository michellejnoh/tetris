<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tetris Skills Course</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 500; background: #fff; color: #000;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  a { color: inherit; }
  button {
    font-family: inherit; font-size: 12px; font-weight: 500; letter-spacing: 1px;
    text-transform: uppercase; background: #000; color: #fff; border: 1.5px solid #000;
    padding: 10px 16px; cursor: pointer;
  }
  button.ghost { background: #fff; color: #000; }
  button:disabled { opacity: 0.3; cursor: default; }

  .page { max-width: 1120px; margin: 0 auto; padding: 28px 24px 40px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 26px; }
  h1 { font-weight: 500; font-size: 34px; letter-spacing: -0.5px; }
  .progress { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: #777; margin-left: auto; }
  header a { font-size: 13px; text-decoration: none; border-bottom: 1.5px solid #000; padding-bottom: 2px; }

  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 36px; align-items: start; }

  .menu .chapter { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #777; margin: 18px 0 6px; }
  .menu .chapter:first-child { margin-top: 0; }
  .menu .item {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    background: #fff; color: #000; border: none; border-left: 2px solid transparent;
    padding: 7px 0 7px 10px; font-size: 13px; letter-spacing: 0; text-transform: none; text-align: left;
  }
  .menu .item.active { border-left-color: #000; }
  .st { display: inline-block; width: 8px; height: 8px; margin-left: 3px; background: #000; vertical-align: 1px; }
  .st.off { background: #fff; box-shadow: inset 0 0 0 1.5px #c8c8c8; }
  .stars-line .st { margin: 0 8px 0 0; }
  .menu select { display: none; }

  .main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: start; }
  .info .num { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #777; margin-bottom: 8px; }
  .info h2 { font-weight: 500; font-size: 28px; letter-spacing: -0.3px; margin-bottom: 6px; }
  .info .term { font-size: 13px; color: #777; margin-bottom: 14px; }
  .info .why { font-size: 15px; line-height: 1.6; color: #333; }
  .info .why p + p { margin-top: 10px; }
  .info .label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #777; margin: 18px 0 6px; }
  .info .goal { font-size: 16px; line-height: 1.5; border-left: 3px solid #000; padding-left: 12px; }
  .info .how { font-size: 14px; line-height: 1.7; }
  .info .stars-line { font-size: 13px; line-height: 1.8; color: #555; }
  .info .stars-line b { color: #000; font-weight: 500; }
  .buttons { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
  .msg { margin-top: 16px; font-size: 14px; line-height: 1.6; min-height: 44px; }
  .msg.no { color: #8C3B57; }

  .play { display: flex; gap: 14px; align-items: flex-start; }
  .board-wrap { position: relative; touch-action: none; }
  canvas#board { display: block; border: 2px solid #000; background: #fff; }
  .side { display: flex; flex-direction: column; gap: 14px; width: 84px; }
  .side .label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: #777; margin-bottom: 4px; }
  #hold-box { border: 1.5px solid #000; padding: 6px 2px 4px; text-align: center; }
  canvas#hold, canvas#next { display: block; margin: 0 auto; }
  .hud .v { font-size: 20px; font-variant-numeric: tabular-nums; margin-bottom: 8px; }
  .caption { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; pointer-events: none; }
  .caption span { display: inline-block; background: #000; color: #fff; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; padding: 6px 10px; }
  .caption:empty { display: none; }

  @media (max-width: 760px), (pointer: coarse) {
    .page { padding: calc(env(safe-area-inset-top) + 10px) 10px 24px; }
    header { margin-bottom: 10px; }
    h1 { font-size: 20px; }
    .progress { font-size: 10px; }
    .layout { grid-template-columns: 1fr; gap: 10px; }
    .menu .chapter, .menu .item { display: none; }
    .menu select {
      display: block; width: 100%; font-family: inherit; font-size: 15px; font-weight: 500;
      padding: 9px 10px; border: 1.5px solid #000; border-radius: 0; background: #fff; color: #000;
      -webkit-appearance: none; appearance: none;
    }
    .main { grid-template-columns: 1fr; gap: 12px; }
    .play { order: -1; justify-content: center; touch-action: none; }
    .side { width: auto; }
    .info .num { display: none; }
    .info h2 { font-size: 20px; }
    .info .term { margin-bottom: 8px; font-size: 12px; }
    .info .why { font-size: 13px; line-height: 1.55; }
    .info .goal { font-size: 14px; }
    .info .how { font-size: 13px; }
    .info .label { margin: 12px 0 4px; font-size: 10px; }
    .buttons { margin-top: 12px; }
    button { padding: 8px 11px; font-size: 11px; }
    .msg { font-size: 13px; margin-top: 10px; min-height: 36px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Skills course</h1>
    <span class="progress" id="progress"></span>
    <a href="index.html">Play Tetris</a>
  </header>

  <div class="layout">
    <nav class="menu" id="menu"></nav>

    <section class="main">
      <div class="info">
        <div class="num" id="num"></div>
        <h2 id="title"></h2>
        <div class="term" id="term"></div>
        <div class="why" id="why"></div>
        <div class="label">Goal</div>
        <p class="goal" id="goal"></p>
        <div class="label">How</div>
        <p class="how" id="how"></p>
        <div class="label">Stars</div>
        <p class="stars-line" id="stars-line"></p>
        <div class="buttons">
          <button id="demo-btn" class="ghost">Show me</button>
          <button id="reset-btn" class="ghost">Restart</button>
          <button id="next-btn">Next</button>
        </div>
        <p class="msg" id="msg"></p>
      </div>

      <div class="play">
        <div class="board-wrap">
          <canvas id="board"></canvas>
          <div class="caption" id="caption"></div>
        </div>
        <div class="side">
          <div id="hold-box"><div class="label">Hold</div><canvas id="hold"></canvas></div>
          <div><div class="label">Next</div><canvas id="next"></canvas></div>
          <div class="hud" id="hud"></div>
        </div>
      </div>
    </section>
  </div>
</div>

<script src="core.js"></script>
<script>
// =====================================================================
//  Lessons
//  Boards list the visible rows top to bottom:  x = block, * = target spot, . = empty
//  Every board and demo here was checked with a solver that runs these same rules.
// =====================================================================
const E = '..........';
const W4 = 'xxxxxx....';
const CHAPTERS = [
  { name: 'T-spin basics', ko: 'T스핀 기초' },
  { name: 'Advanced T-spins', ko: 'T스핀 심화' },
  { name: 'Other spins', ko: 'S·Z·L·J·I 스핀' },
  { name: 'Drills', ko: '연습' },
];

const SPIN_FAIL = 'Not in the marked spot. A plain drop can\'t reach it: lower the piece next to the gap, then rotate it in.';

const LESSONS = [
  // ---------------- T-spin basics ----------------
  {
    ch: 0, name: 'T-spin mini', term: 'T스핀 미니',
    why: ['A T-spin is a T piece that rotates into place with at least three of the four corners around its centre blocked. If the two corners on the side the T points to aren\'t both blocked, it only counts as a mini.',
          'A mini scores more than a plain single, but the real prize is the full T-spin.'],
    keys: 'Move the T to the left wall, <b>Down</b> to the floor, then <b>Up</b> to spin it in.',

    demo: ['left', 'left', 'left', 'softmax', 'cw', 'drop'],

  },
  {

          'The trick is to rotate the T into the slot from under the overhang, not to drop it in.'],
    keys: '<b>Z</b> to point the T left, <b>Down</b> to the bottom, then <b>Z</b> again.',
    touch: 'Two-finger tap, slide down, two-finger tap again.',
    goal: 'Spin the T into the slot for a T-spin single.',
    board: [E, E, E, E, E, E, E, 'xxx..xxxxx', 'xxx...xxx.', 'xxxx.xxxxx'],
    pieces: ['T'], check: 'spin', spin: 'full', lines: 1,
    demo: ['ccw', 'softmax', 'ccw', 'drop'],
    hints: { plain: 'That was a plain drop, not a spin. Point the T left, soft drop, then rotate left again.', other: 'It spun, but not into the slot. Point the T left first, then rotate left once more at the bottom.' },

  {

    keys: '<b>Z</b> to point the T left, <b>Down</b> to the bottom, then <b>Z</b> again.',

    board: [E, E, E, E, E, E, E, 'xxx..xxxxx', 'xxx***xxxx', 'xxxx*xxxxx'],

    demo: ['ccw', 'softmax', 'ccw', 'drop'],
    hints: { plain: 'That was a plain drop, not a spin. Point the T left, soft drop to the bottom, then rotate left again.', other: 'It spun, but not into the slot. Point the T left first, then rotate left once more at the very bottom.' },
    win: 'T-SPIN DOUBLE. 1,200 points, more than a Triple.',
  },
  {
    ch: 0, name: 'T-spin triple', term: 'T스핀 트리플 (TST)',

    keys: 'Move left, <b>Down</b> to the floor, <b>Right</b> under the roof, then <b>Z</b>.',

    pieces: ['T'], check: 'spin', spin: 'full', lines: 3,

  // ---------------- Advanced T-spins ----------------
  {
    ch: 1, name: 'Fin TSD', term: '핀 TSD (Fin)',
    why: ['The same deep kick that makes a T-spin triple works from the other direction. If the T is pointing down and you rotate it, the fifth kick test can drop it two rows into an upright slot. Players call this a Fin.',

    pieces: ['T'], check: 'spin', spin: 'full', lines: 2,
    demo: ['left', 'soft', 'soft', 'soft', 'soft', 'ccw', 'soft', 'soft', 'ccw', 'right', 'cw', 'drop'],
    hints: { plain: 'That was a plain drop. The T has to rotate into the bottom slot.', other: 'It spun, but not deep enough. Point the T down under the roof, move it one step right, then rotate right.' },

  },
  {
    ch: 1, name: 'Double, then triple', term: 'DT포 원리',
    why: ['DT stands for Double and Triple. The DT cannon is a famous opener that stacks a T-spin double on top of a T-spin triple: doing the double opens up the roof and hole the triple needs.',
          'Both are difficult clears, so the triple also scores back-to-back (1.5 times the points). This board is the finished shape, ready to fire.'],

      { ts: 'full', lines: 2, fail: 'The first T has to be the T-spin double at the top. Point it left, soft drop, rotate left again.' },
      { ts: 'full', lines: 3, b2b: true, fail: 'Now the triple: move left, soft drop, slide right under the roof, then rotate left.' },

    demo: ['soft', 'soft', 'ccw', 'soft', 'soft', 'ccw', 'drop', 'left', 'softmax', 'right', 'ccw', 'drop'],

  {
    ch: 1, name: 'Opener TSD', term: '개막TSD',

    touch: 'Place each piece on its outline, then T-spin.',

    pieces: ['L', 'J', 'I', 'O', 'S', 'Z', 'T'], check: 'build',
    guide: [
      [[3, 9], [3, 10], [3, 11], [4, 11]],
      [[2, 9], [2, 10], [1, 11], [2, 11]],
      [[6, 11], [7, 11], [8, 11], [9, 11]],
      [[8, 9], [9, 9], [8, 10], [9, 10]],
      [[6, 8], [6, 9], [7, 9], [7, 10]],
      [[1, 9], [0, 10], [1, 10], [0, 11]],
    ],
    finish: { ts: 'full', lines: 2 },
    demo: ['cw', 'left', 'drop', 'ccw', 'left', 'left', 'drop', 'right', 'right', 'right', 'drop', 'right', 'right', 'right', 'right', 'drop',
           'cw', 'right', 'right', 'drop', 'ccw', 'left', 'left', 'left', 'drop', 'cw', 'softmax', 'cw', 'drop'],
    win: 'OPENER TSD. Seven pieces, 1,200 points, and the leftover stack is still clean.',
  },

  // ---------------- Other spins ----------------
  {
    ch: 2, name: 'S-spin', term: 'S스핀',
    why: ['Every piece can kick, not just T. Official scoring only rewards T-spins, but some modern games score all spins, and in every game a spin lets you fill holes that a plain drop can\'t reach.',
          'Drop the S onto the stack, then rotate it twice. The second turn kicks it down into the notch.'],
    keys: '<b>Down</b> to land the S, then <b>Up</b> twice.',
    touch: 'Slide down, then tap twice.',
    goal: 'Spin the S into the marked notch.',
    board: ['..........', '..........', '..........', '..........', '..........', '..........', 'xx........', 'xx.....xxx', 'xxxxx**xxx', 'xxxx**.xxx'],

    demo: ['softmax', 'cw', 'cw', 'drop'],

  {

    demo: ['left', 'softmax', 'ccw', 'ccw', 'drop'],

    keys: '<b>Down</b> to land, then <b>Z</b> twice.',
    touch: 'Slide down, then two two-finger taps.',
    goal: 'Spin the J into the marked hole.',
    board: ['..........', '..........', '..........', '..........', '..........', '..........', '..........', 'xxx.......', 'xx***xxxxx', 'xx..*xxxxx'],

    touch: 'Slide down, two-finger tap, slide down a little, two-finger tap.',
    goal: 'Spin the L into the marked spot.',
    board: ['..........', '..........', '..........', '..........', '..........', '..........', '..........', '...x......', 'xx***.....', 'xx*xxxxxxx'],
    pieces: ['L'], check: 'target', fail: SPIN_FAIL,
    demo: ['softmax', 'ccw', 'softmax', 'ccw', 'drop'],
    win: 'L-SPIN.',
  },
  {
    ch: 2, name: 'I-spin', term: 'I스핀',
    why: ['The I piece has its own kick table. Stood upright and turned again, it can slide sideways under a block and lie flat in a gap that is blocked from above.'],
    keys: '<b>Down</b> to land, <b>Up</b>, <b>Down</b> once, then <b>Up</b> again.',
    touch: 'Slide down, tap, slide down a little, tap again.',
    goal: 'Spin the I flat into the marked gap.',
    board: ['..........', '..........', '..........', '..........', '..........', '..........', '....x.....', 'xx****xxxx', 'xx..x.xxxx', 'xxxxx.xxxx'],
    pieces: ['I'], check: 'target', fail: SPIN_FAIL,

    why: ['A 4×4 gap and four pieces, with only two ways to solve it. The last piece has to spin into place, so plan the whole thing before you start. Clearing every block on the board is a Perfect Clear, the biggest bonus in the game.'],
    keys: 'Plan all four pieces first. The last one needs a Z-spin.',
    touch: 'Plan all four pieces first. The last one needs a Z-spin.',
    goal: 'Clear the whole board with J, L, S and Z.',
    board: [E, E, E, E, E, E, W4, W4, W4, W4],

  // ---------------- Drills ----------------
  {
    ch: 3, name: 'T-spin drill', term: 'T스핀 연습', drill: 'tspin',
    why: ['Real games don\'t hand you the same slot twice. This drill builds ten random T-spin singles, doubles and triples on either side of the board. Spot the slot type, then spin in.'],
    keys: 'All keys work. The Slot box next to the board tells you which T-spin to do.',
    touch: 'All gestures work.',
    goal: 'Hit 10 random T-spins. A plain drop or the wrong spin counts as a miss.',

  {
    ch: 3, name: 'All-spin drill', term: '올스핀 연습', drill: 'allspin',
    why: ['Random stacks, random pieces. Each round marks a spot that only a spin can reach, with any of the seven pieces. Work out which way to turn and where the kick will send the piece.'],

const ACTION_LABEL = {
  left: 'Move left', right: 'Move right', soft: 'Soft drop', softmax: 'Soft drop',
  drop: 'Hard drop', cw: 'Rotate right', ccw: 'Rotate left', hold: 'Hold',
  wallLeft: 'Hold left (to the wall)', wallRight: 'Hold right (to the wall)',
};

// =====================================================================
//  State
// =====================================================================
const $ = id => document.getElementById(id);
const board = $('board'), ctx = board.getContext('2d');
const holdC = $('hold'), hctx = holdC.getContext('2d');
const nextC = $('next'), nctx = nextC.getContext('2d');
const isTouch = window.matchMedia('(pointer: coarse)').matches;
const palette = Object.values(COLOR);

let VISIBLE = 10, ROWS = 12;
let CELL = 30, NS = 14, compact = false;
let save = { stars: {}, best: {} };
try { save = Object.assign(save, JSON.parse(localStorage.getItem('tetris-spin-course') || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem('tetris-spin-course', JSON.stringify(save)); } catch (e) {} };

let li = 0, L;
let grid = null, targets = [], queue = [], piece = null, holdType = null, holdUsed = false;
let rotations = 0, inputs = 0, lockIndex = 0, lastRot = false, lastKick = 0, lastDifficult = false, combo = -1, usedDemo = false;
let status = 'play';          // play | clearing | demo | demo-clearing | done
let clearRows = [], clearT = 0, popups = [], flashes = [], pendingEv = null;
let demoTimer = null, resetTimer = null, demoRunning = false;
const GRAVITY = 1000, LOCK_DELAY = 500, MAX_RESETS = 15;
let dropAcc = 0, lockT = 0, resets = 0, lowest = 0;
let drill = null;

const empty = () => Array(COLS).fill(null);

// =====================================================================
//  Layout
// =====================================================================
function size() {
  compact = window.matchMedia('(max-width: 760px), (pointer: coarse)').matches;
  if (compact) {
    const W = window.innerWidth, H = window.innerHeight;
    CELL = Math.floor(Math.min((W - 20 - 14 - 76) / COLS, (H - 150) / VISIBLE));
    CELL = Math.max(16, Math.min(34, CELL));
  } else {
    CELL = Math.max(20, Math.min(32, Math.floor((window.innerHeight - 140) / VISIBLE)));
  }
  NS = Math.max(8, Math.round(Math.min(CELL * 0.45, 15)));
  setCanvas(board, ctx, COLS * CELL, VISIBLE * CELL);
  setCanvas(holdC, hctx, 4.6 * NS, 2.4 * NS);
  setCanvas(nextC, nctx, 4.6 * NS, 4 * 2.6 * NS);
  draw();
}

const starsHtml = n => [0, 1, 2].map(k => `<i class="st${k < n ? '' : ' off'}"></i>`).join('');

function renderMenu() {
  let html = '', opts = '';
  CHAPTERS.forEach((c, ci) => {
    html += `<div class="chapter">${ci + 1}. ${c.name} · ${c.ko}</div>`;
    opts += `<optgroup label="${ci + 1}. ${c.name} · ${c.ko}">`;
    LESSONS.forEach((l, i) => {
      if (l.ch !== ci) return;
      const s = save.stars[i] || 0;
      html += `<button class="item${i === li ? ' active' : ''}" data-i="${i}"><span>${l.name}</span><span class="stars">${starsHtml(s)}</span></button>`;
      opts += `<option value="${i}"${i === li ? ' selected' : ''}>${l.name}  (${s}/3)</option>`;
    });
    opts += '</optgroup>';
  });
  $('menu').innerHTML = html + `<select id="picker">${opts}</select>`;
  document.querySelectorAll('.menu .item').forEach(b => b.addEventListener('click', () => openLesson(+b.dataset.i)));
  $('picker').addEventListener('change', e => openLesson(+e.target.value));
  const total = Object.values(save.stars).reduce((a, b) => a + b, 0);
  $('progress').textContent = `${total} / ${LESSONS.length * 3} stars`;
}

const parOf = l => l.demo ? l.demo.filter(a => a !== 'soft' && a !== 'softmax').length : 0;
function starRules(l) {
  if (l.stars) return l.stars;
  return ['Clear it', 'Clear it without Show me', `Clear it without Show me in ${parOf(l)} inputs or fewer`];
}
function renderStarsLine() {
  const have = save.stars[li] || 0;
  $('stars-line').innerHTML = starRules(L).map((r, k) => `<i class="st${k < have ? '' : ' off'}"></i>${k < have ? `<b>${r}</b>` : r}`).join('<br>');
}

function openLesson(i) {
  stopDemo();
  li = i; L = LESSONS[i];
  drill = null;
  const c = CHAPTERS[L.ch];
  $('num').textContent = `Chapter ${L.ch + 1} · ${c.name}${L.drill ? ' · Drill' : ''}`;
  $('title').textContent = L.name;
  $('term').textContent = 'Korean term: ' + L.term;
  $('why').innerHTML = L.why.map(p => `<p>${p}</p>`).join('');
  $('goal').textContent = L.goal;
  $('how').innerHTML = isTouch ? L.touch : L.keys;
  renderStarsLine();
  $('next-btn').disabled = i === LESSONS.length - 1;
  $('demo-btn').disabled = false;
  $('demo-btn').textContent = L.drill ? 'Show this one' : 'Show me';
  grid = null; piece = null; targets = []; queue = [];
  VISIBLE = 10;
  ROWS = VISIBLE + HIDDEN;
  usedDemo = false;
  renderMenu();
  size();
  setMsg('');
  if (L.drill) startDrill(); else reset();
}

function award(n) {
  if (n > (save.stars[li] || 0)) { save.stars[li] = n; persist(); }
  renderMenu();
  renderStarsLine();
}

// =====================================================================
//  Board setup
// =====================================================================
function gridFrom(rows) {
  const g = [], t = [];
  const pad = ROWS - rows.length;
  for (let y = 0; y < pad; y++) g.push(empty());
  rows.forEach((row, ry) => {
    const y = ry + pad;
    g.push([...row].map((ch, x) => ch === 'x' ? palette[(x * 3 + y * 5) % palette.length] : null));
    [...row].forEach((ch, x) => { if (ch === '*') t.push([x, y]); });
  });
  return { g, t };
}

function reset() {
  clearTimeout(resetTimer); resetTimer = null;
  const b = gridFrom(L.board);
  grid = b.g; targets = b.t;
  queue = [...L.pieces];
  holdType = null; holdUsed = false;
  rotations = 0; inputs = 0; lockIndex = 0;
  lastDifficult = false; combo = -1;
  popups = []; flashes = []; clearRows = [];
  status = 'play';
  if (L.check === 'build') targets = guideCells(0);
  spawn();
}

// guide cells are written for a 12-row grid (2 hidden + 10 visible)
const guideCells = k => (L.guide && L.guide[k]) ? L.guide[k].map(([x, y]) => [x, y - 12 + ROWS]) : [];

function spawn(type) {
  if (!type) type = queue.shift();
  if (!type) { piece = null; return; }
  piece = { type, r: 0, x: type === 'O' ? 4 : 3, y: 0 };
  lastRot = false; lastKick = 0;
  dropAcc = 0; lockT = 0; resets = 0;
  if (collidesIn(grid, ROT[type][0], piece.x, piece.y)) { piece = null; return; }
  if (!collidesIn(grid, ROT[type][0], piece.x, 1)) piece.y = 1;
  lowest = piece.y;
}

// moving or rotating a piece that is resting on the stack restarts its lock timer (up to 15 times)
function moved() { if (piece && ground() && resets < MAX_RESETS) { resets++; lockT = 0; } }
function descended() { if (piece.y > lowest) { lowest = piece.y; resets = 0; lockT = 0; } }

const ground = () => collidesIn(grid, ROT[piece.type][piece.r], piece.x, piece.y + 1);

function doAction(a) {
  if (!piece) return false;
  if (a === 'left' || a === 'right') {
    const dx = a === 'left' ? -1 : 1;
    if (collidesIn(grid, ROT[piece.type][piece.r], piece.x + dx, piece.y)) return false;
    piece.x += dx; lastRot = false; moved(); return true;
  }
  if (a === 'wallLeft' || a === 'wallRight') {
    const dx = a === 'wallLeft' ? -1 : 1; let moved = false;
    while (!collidesIn(grid, ROT[piece.type][piece.r], piece.x + dx, piece.y)) { piece.x += dx; moved = true; }
    if (moved) lastRot = false;
    return moved;
  }
  if (a === 'cw' || a === 'ccw') {
    const r = srsRotate(grid, piece, a === 'cw' ? 1 : -1);
    if (!r) return false;
    piece.x = r.x; piece.y = r.y; piece.r = r.r; lastRot = true; lastKick = r.kick; rotations++;
    if (piece.y > lowest) descended();
    moved();
    return true;
  }
  if (a === 'soft' || a === 'softmax') {
    if (ground()) return false;
    piece.y++; lastRot = false; descended(); return true;
  }
  if (a === 'drop') {
    let moved = false;
    while (!ground()) { piece.y++; moved = true; }
    if (moved) lastRot = false;
    lock();
    return true;
  }
  if (a === 'hold') {
    if (holdUsed || drill) return false;
    holdUsed = true;
    const t = piece.type;
    if (holdType) { const h = holdType; holdType = t; spawn(h); }
    else { holdType = t; spawn(); }
    return true;
  }
  return false;
}

// =====================================================================
//  Locking
// =====================================================================
function lock() {
  const ts = tSpinCheck(grid, piece, lastRot, lastKick);
  const cells = pieceCells(piece);
  const type = piece.type;
  cells.forEach(([x, y]) => { if (y >= 0) grid[y][x] = COLOR[type]; });
  flashes.push({ cells, t: 0, dur: 160 });
  piece = null; holdUsed = false;

  const full = [];
  for (let y = 0; y < ROWS; y++) if (grid[y].every(c => c)) full.push(y);
  const n = full.length;
  const difficult = n === 4 || (!!ts && n > 0);
  const b2b = n > 0 && difficult && lastDifficult;
  if (n > 0) lastDifficult = difficult;
  combo = n > 0 ? combo + 1 : -1;

  const ev = { type, ts, n, b2b, combo, cells, index: lockIndex++ };
  const words = [];
  if (ts === 'full') words.push('T-SPIN' + ['', ' SINGLE', ' DOUBLE', ' TRIPLE'][n]);
  else if (ts === 'mini') words.push('MINI T-SPIN' + (n ? ' SINGLE' : ''));
  else if (n >= 2) words.push(['', '', 'DOUBLE', 'TRIPLE', 'TETRIS'][n]);
  if (b2b) words.push('BACK-TO-BACK');
  if (combo > 0) words.push('COMBO ' + combo);
  if (words.length) popups.push({ lines: words, t: 0, dur: 1100 });

  pendingEv = ev;
  if (n) { clearRows = full; clearT = 340; status = status === 'demo' ? 'demo-clearing' : 'clearing'; }
  else afterLock();
}

function afterLock() {
  const ev = pendingEv; pendingEv = null;
  ev.pc = grid.every(r => r.every(c => !c));
  if (ev.pc) popups.push({ lines: ['PERFECT CLEAR'], t: 0, dur: 1300 });
  if (drill) return drillLock(ev);

  const r = evaluate(ev);
  if (r.result === 'win') return win();
  if (r.result === 'fail') return fail(r.why);
  if (L.check === 'build') targets = guideCells(ev.index + 1);
  spawn();
  if (!piece) fail('Out of pieces.');
}

function evaluate(ev) {
  const key = c => c.join(',');
  const same = (a, b) => a.length === b.length && a.every(c => b.some(d => key(c) === key(d)));
  switch (L.check) {
    case 'target':
      if (!same(ev.cells, targets)) return { result: 'fail', why: L.fail || 'Not in the marked spot. Watch the ghost outline before you drop.' };
      if (L.maxRotations && rotations > L.maxRotations) return { result: 'fail', why: `Right spot, but you used ${rotations} rotations. Rotate left once instead.` };
      return { result: 'win' };
    case 'tetrisFirst':
      return ev.n === 4 ? { result: 'win' } : { result: 'fail', why: 'The S piece doesn\'t help here. Hold it, and the I comes out instead.' };
    case 'spin':
      if (ev.ts === L.spin && ev.n === L.lines) return { result: 'win' };
      return { result: 'fail', why: ev.ts ? L.hints.other : L.hints.plain };
    case 'seq': {
      const want = L.seq[ev.index];
      const ok = want && (!want.ts || ev.ts === want.ts) && ev.n === want.lines && (!want.b2b || ev.b2b);
      if (!ok) return { result: 'fail', why: (want || L.seq[L.seq.length - 1]).fail };
      return ev.index === L.seq.length - 1 ? { result: 'win' } : { result: 'go' };
    }
    case 'ren':
      if (ev.n < 1) return { result: 'fail', why: L.fail };
      return ev.index + 1 >= L.ren ? { result: 'win' } : { result: 'go' };
    case 'pc':
      if (ev.pc) return { result: 'win' };
      return queue.length ? { result: 'go' } : { result: 'fail', why: 'Some blocks are left. Plan the pieces so every row finishes together.' };
    case 'build':
      if (ev.index < L.guide.length) {
        return same(ev.cells, guideCells(ev.index)) ? { result: 'go' } : { result: 'fail', why: 'That piece missed its outline. Match each outline exactly.' };
      }
      return ev.ts === L.finish.ts && ev.n === L.finish.lines ? { result: 'win' }
        : { result: 'fail', why: 'The build is right, but the T needs to spin in. Rotate right, soft drop, rotate right again.' };
  }
  return { result: 'go' };
}

function win() {
  status = 'done';
  targets = [];
  popups.push({ lines: ['CLEAR!'], t: -450, dur: 1400 });
  if (demoRunning) {
    demoRunning = false; $('caption').innerHTML = '';
    setMsg('That\'s how it\'s done. Your turn now.');
    resetTimer = setTimeout(reset, 1700);
    return;
  }
  let s = 1;
  if (!usedDemo) s = 2;
  if (!usedDemo && inputs <= parOf(L)) s = 3;
  award(s);
  const extra = s === 3 ? '' : s === 2 ? ` (${inputs} inputs, par ${parOf(L)})` : ' Try again without Show me for more stars.';
  setMsg((li === LESSONS.length - 1 ? 'Course complete! ' : 'Cleared! ') + L.win + extra);
}

function fail(why) {
  status = 'done';
  setMsg(why + ' Resetting…', 'no');
  resetTimer = setTimeout(() => { reset(); setMsg('Try again.'); }, 1700);
}

function setMsg(text, cls = '') { const m = $('msg'); m.textContent = text; m.className = 'msg ' + cls; }

// =====================================================================
//  Search: every reachable resting spot for a piece (used by drills)
// =====================================================================
function explore(g, type, start) {
  const key = s => `${s.x},${s.y},${s.r},${s.lr ? 1 : 0},${s.k}`;
  const q = [{ ...start, lr: false, k: 0, path: [] }], seen = new Set([key(q[0])]), out = [];
  while (q.length) {
    const s = q.shift();
    const sh = ROT[type][s.r];
    if (collidesIn(g, sh, s.x, s.y + 1)) out.push(s);
    const nx = [];
    for (const [dx, nm] of [[-1, 'left'], [1, 'right']])
      if (!collidesIn(g, sh, s.x + dx, s.y)) nx.push({ ...s, x: s.x + dx, lr: false, k: 0, path: [...s.path, nm] });
    if (!collidesIn(g, sh, s.x, s.y + 1)) nx.push({ ...s, y: s.y + 1, lr: false, k: 0, path: [...s.path, 'soft'] });
    for (const [d, nm] of [[1, 'cw'], [-1, 'ccw']]) {
      const r = srsRotate(g, { type, x: s.x, y: s.y, r: s.r }, d);
      if (r) nx.push({ ...s, x: r.x, y: r.y, r: r.r, lr: true, k: r.kick, path: [...s.path, nm] });
    }
    for (const n of nx) { const k = key(n); if (!seen.has(k)) { seen.add(k); q.push(n); } }
  }
  return out;
}
function spawnPos(g, type) {
  const p = { type, r: 0, x: type === 'O' ? 4 : 3, y: 0 };
  if (!collidesIn(g, ROT[type][0], p.x, 1)) p.y = 1;
  return p;
}
function linesAfter(g, type, s) {
  const g2 = g.map(r => r.slice());
  pieceCells({ type, x: s.x, y: s.y, r: s.r }).forEach(([x, y]) => { if (y >= 0) g2[y][x] = 1; });
  return g2.filter(r => r.every(Boolean)).length;
}
function trimSoft(path) { const p = [...path]; while (p.length && p[p.length - 1] === 'soft') p.pop(); return [...p, 'drop']; }

// =====================================================================
//  Drills
// =====================================================================
function startDrill() {
  clearTimeout(resetTimer);
  popups = []; flashes = []; clearRows = [];
  holdType = null; holdUsed = false; lastDifficult = false; combo = -1;
  drill = { kind: L.drill, round: 0, total: 10, hits: 0, t0: 0, secs: null };
  nextRound();
}

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

function nextRound() {
  status = 'play'; inputs = 0; rotations = 0; lockIndex = 0;
  const d = drill;
  if (d.round >= d.total) return finishDrill();
  if (d.round === 0) d.t0 = performance.now();
  queue = []; holdType = null;
  if (d.kind === 'tspin') {
    const gen = genTSpin();
    grid = gen.g; targets = []; d.want = gen.want; d.label = gen.label; d.solution = gen.path;
    spawn('T');
  } else {
    const gen = genAllSpin();
    grid = gen.g; targets = gen.cells; d.label = gen.label; d.solution = gen.path;
    spawn(gen.type);
  }
}

// Random T-spin slot (single, double or triple) on either side; each one is checked by search before use.
function genTSpin() {
  const row = open => { let s = ''; for (let x = 0; x < 10; x++) s += open.includes(x) ? '.' : 'x'; return s; };
  for (let attempt = 0; attempt < 80; attempt++) {
    const kind = ['TSD', 'TSD', 'TSS', 'TST'][rand(0, 3)];
    let rows;
    if (kind === 'TST') {
      const c = rand(3, 8);
      const left = n => Array.from({ length: n }, (_, i) => i);
      rows = [row(left(c)), row(left(c + 1)), row([c]), row([c - 1, c]), row([c])];
    } else {
      const s = rand(1, 8);
      rows = [row([s - 1, s]), row([s - 1, s, s + 1]), row([s])];
      if (kind === 'TSS') {
        let h; do { h = rand(0, 9); } while (Math.abs(h - s) < 3);
        rows[1] = rows[1].slice(0, h) + '.' + rows[1].slice(h + 1);
      }
    }
    if (Math.random() < 0.5) rows = rows.map(r => [...r].reverse().join(''));
    const garbage = rand(0, 2);
    for (let i = 0; i < garbage; i++) { const h = rand(0, 9); rows.push('xxxxxxxxxx'.slice(0, h) + '.' + 'xxxxxxxxxx'.slice(h + 1)); }
    while (rows.length < VISIBLE) rows.unshift(E);
    const g = gridFrom(rows).g;
    const want = { TSD: 2, TSS: 1, TST: 3 }[kind];
    const ok = explore(g, 'T', spawnPos(g, 'T')).filter(s => s.lr && tSpinCheck(g, { type: 'T', x: s.x, y: s.y, r: s.r }, true, s.k) === 'full' && linesAfter(g, 'T', s) === want);
    if (ok.length) {
      ok.sort((a, b) => a.path.length - b.path.length);
      return { g, want, label: { TSD: 'T-spin double', TSS: 'T-spin single', TST: 'T-spin triple' }[kind], path: trimSoft(ok[0].path) };
    }
  }
  return genTSpin();
}

// Random stack with an overhang, and a spot that only a spin can reach (any piece).
// A spot counts only if the search finds it when the last move is a rotation, and never otherwise.
function genAllSpin() {
  const types = ['S', 'Z', 'J', 'L', 'I', 'T', 'S', 'Z', 'J', 'L'];
  for (let attempt = 0; attempt < 400; attempt++) {
    const type = types[rand(0, types.length - 1)];
    const h = Array.from({ length: 10 }, () => rand(0, 4));
    const rows = Array.from({ length: 5 }, (_, y) => Array.from({ length: 10 }, (_, x) => (5 - y) <= h[x] ? 'x' : '.'));
    const ox = rand(0, 9), oy = rand(1, 3), ow = rand(1, 2);
    for (let i = 0; i < ow && ox + i < 10; i++) rows[oy][ox + i] = 'x';
    const rs = rows.map(r => r.join(''));
    if (rs.some(r => !r.includes('.'))) continue;
    const g = gridFrom([E, E, E, E, E, ...rs]).g;
    const byRot = new Map(), plain = new Set();
    for (const st of explore(g, type, spawnPos(g, type))) {
      const cells = pieceCells({ type, x: st.x, y: st.y, r: st.r });
      const k = cells.map(c => c.join(',')).sort().join(';');
      if (!st.lr) { plain.add(k); continue; }
      if (linesAfter(g, type, st) < 1) continue;
      if (!byRot.has(k) || st.path.length < byRot.get(k).path.length) byRot.set(k, { cells, path: st.path });
    }
    const spins = [...byRot.entries()].filter(([k]) => !plain.has(k)).map(([, v]) => v);
    if (!spins.length) continue;
    spins.sort((a, b) => a.path.length - b.path.length);
    return { g, type, cells: spins[0].cells, path: trimSoft(spins[0].path), label: type + '-spin' };
  }
  return genAllSpin();
}

function drillLock(ev) {
  const d = drill;
  const key = c => c.join(',');
  let hit;
  if (d.kind === 'tspin') hit = ev.ts === 'full' && ev.n === d.want;
  else hit = ev.cells.length === targets.length && ev.cells.every(c => targets.some(t => key(t) === key(c)));
  if (demoRunning) { demoRunning = false; $('caption').innerHTML = ''; setMsg('That one was a demo. Your turn on the next one.'); }
  else if (hit) { d.hits++; setMsg(`Hit: ${d.label}.`); }
  else if (d.kind === 'tspin') setMsg(ev.ts ? `Spun, but that wasn't a ${d.label}.` : `Plain drop. That slot was a ${d.label}.`, 'no');
  else setMsg('Missed the marked spot. Look for where the kick would send the piece.', 'no');
  d.round++;
  status = 'done'; targets = [];
  resetTimer = setTimeout(nextRound, 800);
}

function finishDrill() {
  const d = drill;
  status = 'done'; piece = null; targets = [];
  const secs = (performance.now() - d.t0) / 1000;
  d.secs = secs;
  const limit = d.kind === 'tspin' ? 90 : 120;
  award(d.hits === d.total && secs < limit ? 3 : d.hits >= 8 ? 2 : 1);
  setMsg(`Done: ${d.hits} of ${d.total} in ${secs.toFixed(0)} s. Press Restart to go again.`);
}

// =====================================================================
//  Demo ("Show me")
// =====================================================================
function stopDemo() {
  clearTimeout(demoTimer); demoTimer = null; demoRunning = false;
  clearTimeout(resetTimer); resetTimer = null;
  $('caption').innerHTML = '';
}

function runDemo() {
  if (L.drill && (status !== 'play' || !piece)) return;
  stopDemo();
  usedDemo = true;
  let steps;
  if (L.drill) {
    steps = [...drill.solution];
    spawn(piece.type);            // start the current piece over from the top
  } else {
    reset();
    steps = [...L.demo];
  }
  setMsg('Watch the moves, then try it yourself.');
  demoRunning = true; status = 'demo';
  let i = 0;
  const tick = () => {
    if (!demoRunning) return;
    if (status === 'demo-clearing') { demoTimer = setTimeout(tick, 120); return; }
    if (i >= steps.length || !piece) return;
    const a = steps[i];
    $('caption').innerHTML = `<span>${ACTION_LABEL[a]}</span>`;
    if (a === 'softmax' && !ground()) { doAction('soft'); demoTimer = setTimeout(tick, 120); return; }
    if (a !== 'softmax') doAction(a);
    i++;
    if (!demoRunning) return;
    demoTimer = setTimeout(tick, a === 'drop' ? 650 : a === 'soft' ? 110 : 480);
  };
  demoTimer = setTimeout(tick, 500);
}

// =====================================================================
//  Loop and drawing
// =====================================================================
let lastT = 0;
const held = { left: 0, right: 0, soft: 0 };
let dasDir = 0, dasT = 0, arrT = 0, softT = 0;

function frame(t) {
  const dt = Math.min(50, t - (lastT || t)); lastT = t;
  popups.forEach(p => p.t += dt); popups = popups.filter(p => p.t < p.dur);
  flashes.forEach(f => f.t += dt); flashes = flashes.filter(f => f.t < f.dur);

  if (status === 'clearing' || status === 'demo-clearing') {
    clearT -= dt;
    if (clearT <= 0) {
      for (const y of clearRows) { grid.splice(y, 1); grid.unshift(empty()); }
      clearRows = [];
      status = status === 'demo-clearing' ? 'demo' : 'play';
      afterLock();
    }
  }

  // keyboard auto-repeat (DAS 167 ms, then 33 ms)
  if (status === 'play' && piece) {
    if (dasDir) {
      dasT += dt;
      if (dasT >= 167) { arrT += dt; while (arrT >= 33) { arrT -= 33; if (!doAction(dasDir < 0 ? 'left' : 'right')) break; } }
    }
    if (held.soft) { softT += dt; while (softT >= 45) { softT -= 45; doAction('soft'); } }
  }

  // gravity and lock delay, so a piece that lands locks by itself (paused during demos)
  if (status === 'play' && piece) {
    dropAcc += dt;
    while (dropAcc >= GRAVITY) {
      dropAcc -= GRAVITY;
      if (!ground()) { piece.y++; lastRot = false; descended(); } else { dropAcc = 0; break; }
    }
    if (ground()) {
      lockT += dt;
      if (lockT >= LOCK_DELAY || resets >= MAX_RESETS) lock();
    }
  }

  hud();
  draw();
  requestAnimationFrame(frame);
}

function hud() {
  const d = drill;
  let h = '';
  if (d) {
    const secs = d.secs != null ? d.secs : d.t0 ? (performance.now() - d.t0) / 1000 : 0;
    h = `<div class="label">${d.kind === 'tspin' ? 'Slot' : 'Piece'}</div><div class="v" style="font-size:14px;line-height:1.3">${d.label || ''}</div>` +
        `<div class="label">Round</div><div class="v">${Math.min(d.round + 1, d.total)}/${d.total}</div>` +
        `<div class="label">Hits</div><div class="v">${d.hits}</div><div class="label">Time</div><div class="v">${secs.toFixed(0)}</div>`;
  } else if (L && L.demo) h = `<div class="label">Inputs</div><div class="v">${inputs}</div><div class="label">Par</div><div class="v">${parOf(L)}</div>`;
  const el = $('hud'); if (el._h !== h) { el.innerHTML = h; el._h = h; }
}

const py = y => (y - HIDDEN) * CELL;

function draw() {
  if (!grid) return;
  const w = COLS * CELL, h = VISIBLE * CELL;
  ctx.clearRect(0, 0, w, h);
  drawGridLines(ctx, COLS, VISIBLE, CELL);

  targets.forEach(([x, y]) => {
    if (y < HIDDEN || grid[y][x]) return;
    ctx.fillStyle = 'rgba(0,0,0,0.08)'; ctx.fillRect(x * CELL + 3, py(y) + 3, CELL - 6, CELL - 6);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(x * CELL + 3, py(y) + 3, CELL - 6, CELL - 6);
  });

  const clearing = status === 'clearing' || status === 'demo-clearing';
  for (let y = HIDDEN; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) {
      if (!grid[y][x]) continue;
      block(ctx, x * CELL, py(y), CELL, grid[y][x]);
      if (clearing && clearRows.includes(y) && Math.floor((340 - clearT) / 50) % 2 === 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(x * CELL, py(y), CELL, CELL);
      }
    }

  if (piece) {
    let gy = piece.y;
    while (!collidesIn(grid, ROT[piece.type][piece.r], piece.x, gy + 1)) gy++;
    drawGhost(ctx, pieceCells({ ...piece, y: gy }), CELL, HIDDEN);
    pieceCells(piece).forEach(([x, y]) => { if (y >= HIDDEN) block(ctx, x * CELL, py(y), CELL, COLOR[piece.type]); });
  }

  for (const f of flashes) {
    ctx.fillStyle = `rgba(255,255,255,${0.75 * (1 - f.t / f.dur)})`;
    f.cells.forEach(([x, y]) => { if (y >= HIDDEN) ctx.fillRect(x * CELL, py(y), CELL, CELL); });
  }


  popups.forEach((p, i) => {
    if (p.t < 0) return;
    const a = p.t > p.dur - 300 ? (p.dur - p.t) / 300 : 1;
    const pop = p.t < 140 ? 1.5 - 0.5 * (p.t / 140) : 1;
    p.lines.forEach((line, j) => bigText(ctx, line, w / 2, h * 0.3 + (i * 2 + j) * CELL * 0.9, (j ? 0.55 : 0.8) * CELL * pop, a));
  });

  const hw = parseFloat(holdC.style.width), hh = parseFloat(holdC.style.height);
  hctx.clearRect(0, 0, hw, hh);
  if (holdType) drawMini(hctx, holdType, hw / 2, hh / 2, NS, holdUsed ? 0.3 : 1);
  const nw = parseFloat(nextC.style.width), slot = parseFloat(nextC.style.height) / 4;
  nctx.clearRect(0, 0, nw, slot * 4);
  (queue || []).slice(0, 4).forEach((t, i) => drawMini(nctx, t, nw / 2, slot * i + slot / 2, NS));
}

// =====================================================================
//  Input
// =====================================================================
function act(a, countIt = true) {
  if (status !== 'play' || !piece) return;
  if (countIt && !isTouch && a !== 'soft') inputs++;
  doAction(a);
}

// Physical keys (e.code), so Z / X / C work with a Korean keyboard layout too.
const KEYMAP = {
  ArrowLeft: 'left', ArrowRight: 'right', ArrowDown: 'soft',
  ArrowUp: 'cw', KeyX: 'cw', KeyZ: 'ccw', ControlLeft: 'ccw', ControlRight: 'ccw',
  Space: 'drop', KeyC: 'hold', ShiftLeft: 'hold', ShiftRight: 'hold',
};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'KeyR') { openLesson(li); return; }
  const a = KEYMAP[e.code];
  if (!a) return;
  e.preventDefault();
  if (e.repeat) return;
  if (a === 'left' || a === 'right') {
    held[a] = 1; dasDir = a === 'left' ? -1 : 1; dasT = 0; arrT = 0;
    act(a);
  } else if (a === 'soft') { held.soft = 1; softT = 0; act('soft'); }
  else act(a);
});
document.addEventListener('keyup', e => {
  const a = KEYMAP[e.code];
  if (a === 'left' || a === 'right') { held[a] = 0; dasDir = held.left ? -1 : held.right ? 1 : 0; dasT = 0; arrT = 0; }
  if (a === 'soft') held.soft = 0;
});
window.addEventListener('blur', () => { held.left = held.right = held.soft = 0; dasDir = 0; });

attachTouch({
  active: () => status === 'play' && !!piece,
  cell: () => CELL,
  holdEl: $('hold-box'),
  area: document.querySelector('.play'),
  move: dx => act(dx < 0 ? 'left' : 'right', false),
  soft: () => act('soft', false),
  hard: () => act('drop', false),
  cw: () => act('cw', false),
  ccw: () => act('ccw', false),
  hold: () => act('hold', false),
  gesture: () => { if (isTouch) inputs++; },
});

$('demo-btn').addEventListener('click', runDemo);
$('reset-btn').addEventListener('click', () => openLesson(li));
$('next-btn').addEventListener('click', () => { if (li < LESSONS.length - 1) openLesson(li + 1); });
window.addEventListener('resize', size);

const firstOpen = LESSONS.findIndex((_, i) => !save.stars[i]);
openLesson(firstOpen === -1 ? 0 : firstOpen);
requestAnimationFrame(frame);
</script>

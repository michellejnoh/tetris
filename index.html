<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tetris</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 500;
    background: #fff;
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  a { color: inherit; }

  /* ---------- Desktop ---------- */
  .game {
    display: grid;
    grid-template-columns: 130px auto 130px;
    grid-template-rows: auto auto auto 1fr;
    grid-template-areas:
      "title   board next"
      "hold    board next"
      "stats   board keys"
      "actions board keys";
    gap: 0 28px;
    padding: 24px;
  }
  .title   { grid-area: title; font-size: 34px; letter-spacing: -0.5px; line-height: 1; margin-bottom: 26px; }
  .hold    { grid-area: hold; }
  .next    { grid-area: next; }
  .stats   { grid-area: stats; display: flex; flex-direction: column; gap: 18px; margin-top: 28px; }
  .actions { grid-area: actions; margin-top: 28px; font-size: 13px; }
  .keys    { grid-area: keys; font-size: 12px; line-height: 1.8; color: #777; margin-top: 24px; }
  .board-wrap { grid-area: board; position: relative; will-change: transform; }

  canvas#board { display: block; background: #fff; border: 2px solid #000; }
  canvas#hold, canvas#next { display: block; }

  .label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #777; margin-bottom: 8px; }
  .value { font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .keys b { font-weight: 500; color: #000; }
  .actions a { text-decoration: none; border-bottom: 1.5px solid #000; padding-bottom: 2px; }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(255, 255, 255, 0.8);
    text-align: center; padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-weight: 500; font-size: 30px; letter-spacing: 2px; text-transform: uppercase; }
  .overlay p { font-size: 13px; color: #555; line-height: 1.7; }
  .overlay a { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; text-decoration: none; border-bottom: 1.5px solid #000; padding-bottom: 2px; }
  button {
    font-family: inherit; font-size: 13px; font-weight: 500;
    letter-spacing: 1px; text-transform: uppercase;
    background: #000; color: #fff; border: none;
    padding: 12px 22px; cursor: pointer;
  }
  .drag-setting { display: none; align-items: center; gap: 6px; font-size: 11px; margin-top: 4px; }
  .drag-setting .ds-label { white-space: nowrap; letter-spacing: 1px; text-transform: uppercase; color: #777; margin-right: 4px; }
  .drag-setting .ds-btn { background: #fff; color: #000; border: 1.5px solid #000; padding: 6px 9px; font-size: 11px; letter-spacing: 0.5px; text-transform: none; }
  .drag-setting .ds-btn.on { background: #000; color: #fff; }
  #pause-btn { display: none; background: none; color: #000; border: 1.5px solid #000; padding: 7px 10px; font-size: 11px; }
  .mobile-only { display: none; }

  /* ---------- Phone: big board, hold + next in a column on the right ---------- */
  @media (max-width: 600px), (pointer: coarse) {
    body { align-items: flex-start; }
    .game {
      grid-template-columns: auto auto;
      grid-template-rows: auto auto auto 1fr;
      grid-template-areas:
        "stats actions"
        "board hold"
        "board next"
        "board .";
      gap: 8px 8px;
      padding: calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px);
    }
    .title, .keys, .desktop-only, .actions a { display: none; }
    .mobile-only { display: block; }
    #pause-btn { display: block; }
    .drag-setting { display: flex; }
    .actions { margin: 0; justify-self: end; align-self: center; }
    .stats { flex-direction: row; gap: 16px; margin: 0; align-self: center; }
    .stats .label { font-size: 9px; margin-bottom: 2px; letter-spacing: 1px; }
    .stats .value { font-size: 17px; }
    .hold {
      border: 1.5px solid #000; padding: 6px 0 4px;
      display: flex; flex-direction: column; align-items: center;
    }
    .next { display: flex; flex-direction: column; align-items: center; margin-top: 4px; }
    .hold .label, .next .label { font-size: 9px; margin-bottom: 4px; letter-spacing: 1px; }
  }
</style>
</head>
<body>
<div class="game">
  <div class="title">Tetris</div>

  <div class="hold" id="hold-box">
    <div class="label">Hold</div>
    <canvas id="hold"></canvas>
  </div>

  <div class="stats">
    <div><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div><div class="label">Lines</div><div class="value" id="lines">0</div></div>
    <div><div class="label">Level</div><div class="value" id="level">1</div></div>
    <div><div class="label">Best</div><div class="value" id="best">0</div></div>
  </div>

  <div class="actions">
    <a href="skills.html">Skills course</a>
    <button id="pause-btn">Pause</button>
  </div>

  <div class="board-wrap" id="wrap">
    <canvas id="board"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">Tetris</h2>
      <p id="ov-text"></p>
      <button id="ov-btn">Start</button>
      <a href="skills.html" id="ov-link">Learn the skills</a>
      <div class="drag-setting" id="drag-setting"></div>
    </div>
  </div>

  <div class="next">
    <div class="label">Next</div>
    <canvas id="next"></canvas>
  </div>

  <div class="keys">
    <b>Left / Right</b> move<br>
    <b>Down</b> soft drop<br>
    <b>Space</b> hard drop<br>
    <b>Up / X</b> rotate right<br>
    <b>Z / Ctrl</b> rotate left<br>
    <b>C / Shift</b> hold<br>
    <b>Esc / P</b> pause
  </div>
</div>

<script src="core.js"></script>
<script>
// ---------- Game settings (Tetris Guideline) ----------
const VISIBLE = 20, ROWS = VISIBLE + HIDDEN;
const LOCK_DELAY = 500;      // ms a piece can rest on the stack before locking
const MAX_RESETS = 15;       // moves/rotations that reset the lock timer
const DAS = 167, ARR = 33;   // key auto-repeat: delay, then rate (ms)
const CLEAR_MS = 420;        // line-clear animation length
const NEXT_COUNT = 5;

const $ = id => document.getElementById(id);
const board = $('board'), ctx = board.getContext('2d');
const holdC = $('hold'), hctx = holdC.getContext('2d');
const nextC = $('next'), nctx = nextC.getContext('2d');
const wrap = $('wrap'), overlay = $('overlay');
const ovTitle = $('ov-title'), ovText = $('ov-text'), ovBtn = $('ov-btn'), ovLink = $('ov-link');
const pauseBtn = $('pause-btn');

const START_TEXT =
  '<span class="desktop-only">Press Enter to start</span>' +
  '<span class="mobile-only">Drag to move, tap to rotate<br>Slide down to drop faster<br>Flick down to drop, flick up to hold<br>Two-finger tap to rotate left</span>';

let CELL = 30, NS = 20, compact = false, nextShown = NEXT_COUNT;

// ---------- Sizing ----------
function sizeCanvases() {
  compact = window.matchMedia('(max-width: 600px), (pointer: coarse)').matches;
  if (compact) {
    const W = window.innerWidth, H = window.innerHeight;
    // board (10 cells) + side column (~1.9 cells) + gaps; height: 20 cells + top bar
    CELL = Math.floor(Math.min((W - 28) / 11.9, (H - 70) / VISIBLE));
    CELL = Math.max(14, Math.min(40, CELL));
    NS = Math.max(7, Math.round(CELL * 0.4));
    nextShown = 4;
    setCanvas(holdC, hctx, 4.4 * NS, 2.4 * NS);
    setCanvas(nextC, nctx, 4.4 * NS, nextShown * 2.9 * NS);
  } else {
    const maxH = window.innerHeight - 60;
    const maxW = window.innerWidth - 380;
    CELL = Math.max(16, Math.min(34, Math.floor(Math.min(maxH / VISIBLE, maxW / COLS))));
    NS = Math.round(CELL * 0.62);
    nextShown = NEXT_COUNT;
    setCanvas(holdC, hctx, 4.5 * NS, 2.8 * NS);
    setCanvas(nextC, nctx, 4.5 * NS, nextShown * 2.8 * NS);
  }
  setCanvas(board, ctx, COLS * CELL, VISIBLE * CELL);
  draw();
}

// ---------- Game state ----------
let grid, piece, queue, holdType, holdUsed;
let score, lines, level, best = 0, b2b, combo;
let state = 'idle', prevState = null;
let dropAcc, lockT, resets, lowest, lastRot, lastKick;
let readyT = 0, clearT = 0, clearRows = [], overT = 0;
let softHeld = false, dasDir = 0, dasT = 0, arrT = 0;
const heldKeys = { left: false, right: false };
let flashes = [], particles = [], trails = [], popups = [], shakeT = 0, shakeAmp = 0;

try { best = +localStorage.getItem('tetris-best') || 0; } catch (e) {}

const newGrid = () => Array.from({ length: ROWS }, () => Array(COLS).fill(null));

function bag() {
  const b = Object.keys(SHAPES);
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}
function fillQueue() { while (queue.length < NEXT_COUNT + 1) queue.push(...bag()); }

const collides = (shape, x, y) => collidesIn(grid, shape, x, y);
const shapeOf = p => ROT[p.type][p.r];
const onGround = () => collides(shapeOf(piece), piece.x, piece.y + 1);

function spawn(type) {
  if (!type) { type = queue.shift(); fillQueue(); }
  piece = { type, r: 0, x: type === 'O' ? 4 : 3, y: 0 };
  dropAcc = 0; lockT = 0; resets = 0; lowest = 0; lastRot = false; lastKick = 0;
  if (collides(shapeOf(piece), piece.x, piece.y)) { gameOver(); return; }  // block out
  if (!onGround()) { piece.y++; lowest = piece.y; }                        // drop into view at once
}

function afterMove() {
  if (onGround() && resets < MAX_RESETS) { resets++; lockT = 0; }
}

function descended() {
  lastRot = false;
  if (piece.y > lowest) { lowest = piece.y; resets = 0; lockT = 0; }
}

function tryMove(dx) {
  if (!piece || collides(shapeOf(piece), piece.x + dx, piece.y)) return false;
  piece.x += dx; lastRot = false; afterMove();
  return true;
}

function tryRotate(dir) {
  if (!piece) return false;
  const r = srsRotate(grid, piece, dir);
  if (!r) return false;
  piece.x = r.x; piece.y = r.y; piece.r = r.r;
  lastRot = true; lastKick = r.kick;
  afterMove();
  return true;
}

function softStep() {
  if (!piece || onGround()) return false;
  piece.y++; score += 1; descended();
  return true;
}

function hardDrop() {
  if (!piece) return;
  let d = 0;
  while (!collides(shapeOf(piece), piece.x, piece.y + d + 1)) d++;
  if (d > 0) {
    const cols = {};
    pieceCells(piece).forEach(([gx, gy]) => { if (cols[gx] === undefined || gy < cols[gx]) cols[gx] = gy; });
    trails.push({ cols, dy: d, color: COLOR[piece.type], t: 0, dur: 200 });
    piece.y += d; lastRot = false;
  }
  score += d * 2;
  shake(110, CELL * 0.12);
  lockPiece();
}

function hold() {
  if (!piece || holdUsed) return;
  const t = piece.type;
  holdUsed = true;
  if (holdType) { const h = holdType; holdType = t; spawn(h); }
  else { holdType = t; spawn(); }
}

function lockPiece() {
  const tspin = tSpinCheck(grid, piece, lastRot, lastKick);
  const cells = pieceCells(piece);
  cells.forEach(([gx, gy]) => { if (gy >= 0) grid[gy][gx] = COLOR[piece.type]; });
  flashes.push({ cells, t: 0, dur: 160 });
  if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
  const lockedAbove = cells.every(([, gy]) => gy < HIDDEN);
  piece = null;
  holdUsed = false;

  if (lockedAbove) { gameOver(); return; }  // lock out

  const full = [];
  for (let y = 0; y < ROWS; y++) if (grid[y].every(c => c)) full.push(y);
  award(full.length, tspin);

  if (full.length) {
    clearRows = full;
    clearT = CLEAR_MS;
    state = 'clearing';
    full.forEach(y => grid[y].forEach((c, x) => {
      for (let k = 0; k < 2; k++) particles.push({
        x: x + 0.5, y: y + 0.5,
        vx: (Math.random() - 0.5) * 0.02,
        vy: -(0.006 + Math.random() * 0.014),
        color: c, t: 0, dur: 550 + Math.random() * 300,
      });
    }));
    if (full.length === 4) shake(260, CELL * 0.22);
  } else {
    spawn();
  }
  updateStats();
}

function finishClear() {
  for (const y of clearRows) { grid.splice(y, 1); grid.unshift(Array(COLS).fill(null)); }
  clearRows = [];
  if (grid.every(r => r.every(c => !c))) {
    score += 2000 * level;
    popups.push({ lines: ['PERFECT CLEAR'], t: 0, dur: 1300 });
  }
  state = 'playing';
  spawn();
  updateStats();
}

function award(n, tspin) {
  const lv = level;
  let pts = 0, label = '';
  if (tspin === 'full') {
    pts = [400, 800, 1200, 1600][n];
    label = 'T-SPIN' + ['', ' SINGLE', ' DOUBLE', ' TRIPLE'][n];
  } else if (tspin === 'mini') {
    pts = [100, 200, 400][Math.min(n, 2)];
    label = 'MINI T-SPIN' + ['', ' SINGLE', ' DOUBLE'][Math.min(n, 2)];
  } else {
    pts = [0, 100, 300, 500, 800][n];
    label = ['', '', 'DOUBLE', 'TRIPLE', 'TETRIS'][n];
  }
  const out = [];
  if (label) out.push(label);

  const difficult = n === 4 || (tspin && n > 0);
  if (n > 0) {
    if (difficult) {
      if (b2b) { pts *= 1.5; out.push('BACK-TO-BACK'); }
      b2b = true;
    } else b2b = false;
  }
  score += Math.floor(pts * lv);

  if (n > 0) {
    combo++;
    if (combo > 0) { score += 50 * combo * lv; out.push('COMBO ' + combo); }
  } else combo = -1;

  lines += n;
  const newLevel = Math.floor(lines / 10) + 1;
  if (newLevel > level) { level = newLevel; out.push('LEVEL ' + level); }
  if (out.length) popups.push({ lines: out, t: 0, dur: 1200 });
}

function updateStats() {
  $('score').textContent = score;
  $('lines').textContent = lines;
  $('level').textContent = level;
  if (score > best) {
    best = score;
    try { localStorage.setItem('tetris-best', best); } catch (e) {}
  }
  $('best').textContent = best;
}

function shake(ms, amp) { shakeT = Math.max(shakeT, ms); shakeAmp = Math.max(shakeAmp, amp); }

// ---------- Flow ----------
function showOverlay(title, html, btn, link = true) {
  ovTitle.textContent = title; ovText.innerHTML = html; ovBtn.textContent = btn;
  ovLink.style.display = link ? '' : 'none';
  renderDragSetting($('drag-setting'));
  overlay.classList.remove('hidden');
}

function start() {
  grid = newGrid(); queue = []; fillQueue();
  holdType = null; holdUsed = false; piece = null;
  score = 0; lines = 0; level = 1; b2b = false; combo = -1;
  flashes = []; particles = []; trails = []; popups = [];
  softHeld = false; dasDir = 0;
  updateStats();
  overlay.classList.add('hidden');
  pauseBtn.textContent = 'Pause';
  state = 'ready'; readyT = 1300;
}

function togglePause() {
  if (['playing', 'clearing', 'ready'].includes(state)) {
    prevState = state; state = 'paused';
    pauseBtn.textContent = 'Resume';
    showOverlay('Paused', compact ? 'Tap to resume' : 'Press Esc or P to resume', 'Resume');
  } else if (state === 'paused') {
    state = prevState;
    pauseBtn.textContent = 'Pause';
    overlay.classList.add('hidden');
  }
}

function gameOver() {
  state = 'over'; overT = 0; piece = null;
  updateStats();
}

// ---------- Main loop ----------
let last = 0;
function frame(t) {
  const dt = Math.min(50, t - (last || t));
  last = t;

  if (state === 'ready') {
    readyT -= dt;
    if (readyT <= 0) { state = 'playing'; spawn(); }
  } else if (state === 'playing') {
    update(dt);
  } else if (state === 'clearing') {
    clearT -= dt;
    if (clearT <= 0) finishClear();
  } else if (state === 'over') {
    overT += dt;
    if (overT > VISIBLE * 35 + 400 && overlay.classList.contains('hidden')) {
      showOverlay('Game Over', `Score ${score}${score >= best && score > 0 ? '<br>New best' : ''}`, 'Play again');
    }
  }

  if (state !== 'paused') tickEffects(dt);
  draw();
  requestAnimationFrame(frame);
}

function update(dt) {
  if (!piece) return;

  if (dasDir) {
    dasT += dt;
    if (dasT >= DAS) {
      arrT += dt;
      while (arrT >= ARR) { arrT -= ARR; if (!tryMove(dasDir)) break; }
    }
  }

  const g = gravityMs(level);
  const interval = softHeld ? g / 20 : g;
  dropAcc += dt;
  while (dropAcc >= interval) {
    dropAcc -= interval;
    if (!onGround()) { piece.y++; if (softHeld) score += 1; descended(); }
    else { dropAcc = 0; break; }
  }
  if (softHeld) updateStats();

  if (onGround()) {
    lockT += dt;
    // after 15 resets the piece locks as soon as it touches down
    if (lockT >= LOCK_DELAY || resets >= MAX_RESETS) lockPiece();
  }
}

function tickEffects(dt) {
  flashes.forEach(f => f.t += dt); flashes = flashes.filter(f => f.t < f.dur);
  trails.forEach(f => f.t += dt); trails = trails.filter(f => f.t < f.dur);
  popups.forEach(f => f.t += dt); popups = popups.filter(f => f.t < f.dur);
  particles.forEach(p => { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.00005 * dt; });
  particles = particles.filter(p => p.t < p.dur);
  if (shakeT > 0) {
    shakeT -= dt;
    const a = shakeT > 0 ? shakeAmp * (shakeT / 200) : 0;
    wrap.style.transform = a ? `translate(${(Math.random() - 0.5) * a}px, ${Math.random() * a}px)` : '';
    if (shakeT <= 0) shakeAmp = 0;
  }
}

// ---------- Drawing ----------
const vy = y => (y - HIDDEN) * CELL;

function draw() {
  const w = COLS * CELL, h = VISIBLE * CELL;
  ctx.clearRect(0, 0, w, h);
  drawGridLines(ctx, COLS, VISIBLE, CELL);
  if (!grid) { drawPreviews(); return; }

  for (let y = HIDDEN; y < ROWS; y++) {
    if (state === 'clearing' && clearRows.includes(y)) continue;
    for (let x = 0; x < COLS; x++) if (grid[y][x]) block(ctx, x * CELL, vy(y), CELL, grid[y][x]);
  }

  // clearing rows: blink, then wipe out from the centre
  if (state === 'clearing' || (state === 'paused' && prevState === 'clearing')) {
    const p = 1 - clearT / CLEAR_MS;
    for (const y of clearRows) {
      for (let x = 0; x < COLS; x++) {
        if (p < 0.5) {
          block(ctx, x * CELL, vy(y), CELL, grid[y][x]);
          if (Math.floor(p * 16) % 2 === 0) { ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(x * CELL, vy(y), CELL, CELL); }
        } else {
          const q = (p - 0.5) / 0.5;
          if (Math.abs(x + 0.5 - COLS / 2) / (COLS / 2) > q) {
            ctx.fillStyle = '#000';
            ctx.fillRect(x * CELL, vy(y) + CELL * 0.3, CELL, CELL * 0.4);
          }
        }
      }
    }
  }

  if (piece && state !== 'over') {
    let gy = piece.y;
    while (!collides(shapeOf(piece), piece.x, gy + 1)) gy++;
    drawGhost(ctx, pieceCells({ ...piece, y: gy }), CELL, HIDDEN);
  }

  for (const tr of trails) {
    const a = 1 - tr.t / tr.dur;
    for (const gx in tr.cols) {
      const top = Math.max(HIDDEN, tr.cols[gx]), bottom = tr.cols[gx] + tr.dy;
      if (bottom <= top) continue;
      const g = ctx.createLinearGradient(0, vy(top), 0, vy(bottom));
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, tr.color);
      ctx.globalAlpha = 0.45 * a;
      ctx.fillStyle = g;
      ctx.fillRect(gx * CELL + CELL * 0.15, vy(top), CELL * 0.7, vy(bottom) - vy(top));
      ctx.globalAlpha = 1;
    }
  }

  if (piece && state !== 'over') {
    const resting = onGround() && state === 'playing';
    const alpha = resting ? 1 - 0.25 * (lockT / LOCK_DELAY) : 1;
    pieceCells(piece).forEach(([x, y]) => { if (y >= HIDDEN) block(ctx, x * CELL, vy(y), CELL, COLOR[piece.type], alpha); });
  }

  for (const f of flashes) {
    ctx.fillStyle = `rgba(255,255,255,${0.75 * (1 - f.t / f.dur)})`;
    f.cells.forEach(([x, y]) => { if (y >= HIDDEN) ctx.fillRect(x * CELL, vy(y), CELL, CELL); });
  }

  for (const p of particles) {
    const a = 1 - p.t / p.dur, s = CELL * 0.28 * (0.5 + a * 0.5);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x * CELL - s / 2, (p.y - HIDDEN) * CELL - s / 2, s, s);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.strokeRect(p.x * CELL - s / 2 + .5, (p.y - HIDDEN) * CELL - s / 2 + .5, s - 1, s - 1);
    ctx.globalAlpha = 1;
  }

  // game over: stack turns grey row by row from the bottom, blocks stay bevelled
  if (state === 'over') {
    const n = Math.min(VISIBLE, Math.floor(overT / 35));
    for (let i = 0; i < n; i++) {
      const y = ROWS - 1 - i;
      for (let x = 0; x < COLS; x++) if (grid[y][x]) block(ctx, x * CELL, vy(y), CELL, GREY);
    }
  }

  if (state === 'ready' || (state === 'paused' && prevState === 'ready')) {
    const go = readyT < 450;
    bigText(ctx, go ? 'GO!' : 'READY', w / 2, h * 0.42, CELL * (go ? 1.6 : 1.2));
  }

  popups.forEach((pp, i) => {
    const t = pp.t, a = t > pp.dur - 300 ? (pp.dur - t) / 300 : 1;
    const pop = t < 140 ? 1.5 - 0.5 * (t / 140) : 1;
    const rise = (t / pp.dur) * CELL * 0.8;
    pp.lines.forEach((line, j) => {
      const size = (j === 0 ? CELL * 0.85 : CELL * 0.55) * pop;
      bigText(ctx, line, w / 2, h * 0.3 + j * CELL * 0.9 - rise + i * 4, size, a);
    });
  });

  drawPreviews();
}

function drawPreviews() {
  const hw = parseFloat(holdC.style.width), hh = parseFloat(holdC.style.height);
  hctx.clearRect(0, 0, hw, hh);
  if (holdType) drawMini(hctx, holdType, hw / 2, hh / 2, NS, holdUsed ? 0.3 : 1);

  const nw = parseFloat(nextC.style.width), slot = parseFloat(nextC.style.height) / nextShown;
  nctx.clearRect(0, 0, nw, slot * nextShown);
  if (queue) queue.slice(0, nextShown).forEach((t, i) => drawMini(nctx, t, nw / 2, slot * i + slot / 2, NS));
}

// ---------- Input: keyboard ----------
function act(a) {
  if (state !== 'playing' || !piece) return;
  if (a === 'left') tryMove(-1);
  else if (a === 'right') tryMove(1);
  else if (a === 'cw') tryRotate(1);
  else if (a === 'ccw') tryRotate(-1);
  else if (a === 'soft') softStep();
  else if (a === 'drop') hardDrop();
  else if (a === 'hold') hold();
  updateStats();
}

// Physical keys (e.code), so Z / X / C still work when the keyboard is set to Korean or another language.
const KEYMAP = {
  ArrowLeft: 'left', ArrowRight: 'right', ArrowDown: 'soft',
  ArrowUp: 'cw', KeyX: 'cw',
  KeyZ: 'ccw', ControlLeft: 'ccw', ControlRight: 'ccw',
  Space: 'drop', KeyC: 'hold', ShiftLeft: 'hold', ShiftRight: 'hold',
};

document.addEventListener('keydown', e => {
  const a = KEYMAP[e.code];
  if (a) e.preventDefault();
  if (e.repeat) return;
  if (e.code === 'Escape' || e.code === 'KeyP' || e.code === 'F1') { e.preventDefault(); togglePause(); return; }
  if (e.code === 'Enter' || e.code === 'NumpadEnter') {
    if (state === 'paused') togglePause();
    else if (state === 'idle' || (state === 'over' && !overlay.classList.contains('hidden'))) start();
    return;
  }
  if (!a) return;
  if (a === 'left' || a === 'right') {
    heldKeys[a] = true;
    dasDir = a === 'left' ? -1 : 1; dasT = 0; arrT = 0;
    act(a);
  } else if (a === 'soft') softHeld = true;
  else act(a);
});

document.addEventListener('keyup', e => {
  const a = KEYMAP[e.code];
  if (a === 'left' || a === 'right') {
    heldKeys[a] = false;
    dasDir = heldKeys.left ? -1 : heldKeys.right ? 1 : 0;
    dasT = 0; arrT = 0;
  } else if (a === 'soft') softHeld = false;
});

window.addEventListener('blur', () => {
  heldKeys.left = heldKeys.right = false; dasDir = 0; softHeld = false;
  if (['playing', 'clearing', 'ready'].includes(state)) togglePause();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && ['playing', 'clearing', 'ready'].includes(state)) togglePause();
});

ovBtn.addEventListener('click', () => { state === 'paused' ? togglePause() : start(); });
overlay.addEventListener('click', e => { if (e.target.closest('.drag-setting')) return; if (e.target === overlay || e.target.closest('h2, p')) ovBtn.click(); });
pauseBtn.addEventListener('click', togglePause);

// ---------- Input: touch ----------
attachTouch({
  active: () => state === 'playing' || state === 'clearing',
  cell: () => CELL,
  holdEl: $('hold-box'),
  move: dx => act(dx < 0 ? 'left' : 'right'),
  soft: () => act('soft'),
  hard: () => act('drop'),
  cw: () => act('cw'),
  ccw: () => act('ccw'),
  hold: () => act('hold'),
});

window.addEventListener('resize', sizeCanvases);
ovText.innerHTML = START_TEXT;
renderDragSetting($('drag-setting'));
sizeCanvases();
requestAnimationFrame(frame);
</script>
</body>
</html>
